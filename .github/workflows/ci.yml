name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend_tidb/requirements.txt
            backend_tidb/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r backend_tidb/requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q backend_tidb app.py
      - name: Run tests
        env:
          APP_SECRET_KEY: ci-only-secret-that-is-not-used-outside-tests
          INIT_SCHEMA_ON_START: "false"
        run: pytest -q

  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36"
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
